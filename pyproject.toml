[project]
name = "banking-fraud-detection-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "celery-redbeat>=2.4.2",
    "email-validator>=2.3.0",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.136.3",
    "flower>=2.2.0",
    "greenlet>=3.5.1",
    "loguru>=0.7.3",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "redis>=8.1.0",
    "sqlmodel>=0.0.38",
    "svcs>=26.2.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "celery-types>=0.26.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pydocstyle>=6.3.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "ruff>=0.15.17",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-lint>=1.0.2",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
env = [
    "PROJECT_NAME=NextGen Bank - FastAPI",
    "PROJECT_DESCRIPTION=Test environment",
    "API_V1_STR=/api/v1",
    "SITE_NAME=NextGen Bank",
    "DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test",
    "REDIS_HOST=localhost",
    "REDIS_PORT=6379",
    "REDIS_DB=0",
    "RABBITMQ_HOST=localhost",
    "RABBITMQ_PORT=5672",
    "RABBITMQ_USER=guest",
    "RABBITMQ_PASSWORD=guest",
]

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "duplicate-code"]
