services:
  traefik:
    # * Requires v3.6.2+: earlier versions bundle a Docker Go SDK that defaults to API v1.24,
    # * which Docker Engine 29+ (minimum API 1.40) rejects — Traefik fails to discover containers.
    image: docker.io/traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.docker # Enable Traefik to discover services from Docker
    ports:
      - "80:80"     # HTTP traffic
      - "8080:8080" # Traefik dashboard
      - "443:443"   # HTTPS traffic
    volumes:
      - ./src/backend/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml # Traefik configuration file
      - /var/run/docker.sock:/var/run/docker.sock:ro # Allow Traefik to listen to Docker events and discover containers
    networks:
      - nextgen_local_nw

  api: &api
    build:
      context: .
      dockerfile: ./src/backend/docker/local/fastapi/Dockerfile
    volumes:
      # * Mount source code over the image's WORKDIR (/app) for hot-reload
      # * (fastapi dev --reload and the watchfiles-based Celery scripts watch /app/src)
      - .:/app
      # * Anonymous volume keeps the image's .venv instead of the host's. It is seeded from
      # * the image only when created: after changing dependencies, rebuild with
      # * `up -d --build --renew-anon-volumes` to pick up the new .venv.
      - /app/.venv
      # * Named volume for logs — Docker seeds it from the image layer on first use, preserving
      # * the fastapi-user ownership set by the Dockerfile. A bind mount would be created by
      # * Docker as root on the host, making the directory unwritable by the non-root container user.
      - nextgen_local_logs:/app/src/backend/app/logs
    ports:
      - "8000:8000" # Expose the FastAPI app on port 8000
    env_file:
      - ./src/.envs/.env.local
    command: /start.sh # Overrides CMD; runs fastapi dev with hot-reload (see start.sh)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"  # Route api.localhost to this service
      - "traefik.http.routers.api.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=8000"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.timeout=5s"
    depends_on:
      postgres-db:
        condition: service_started
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy # wait until Redis answers PING
      rabbitmq:
        condition: service_healthy # wait until RabbitMQ accepts connections
    networks:
      - nextgen_local_nw

  mailpit:
    image: docker.io/axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025" # SMTP port for sending emails
      - "8025:8025" # Web UI for viewing emails
    volumes:
      - nextgen_mailpit_data:/data # Persist email data outside the container
    networks:
      - nextgen_local_nw

  postgres-db:
    build:
      context: .
      dockerfile: ./src/backend/docker/local/postgres/Dockerfile
    ports:
      - "5432:5432"
    volumes:
      - nextgen_local_db:/var/lib/postgresql/data # Persist PostgreSQL data outside the container
    env_file:
      - ./src/.envs/.env.local
    networks:
      - nextgen_local_nw

  redis:
    image: docker.io/redis:7.0-alpine
    command: ["redis-server", "--appendonly", "yes"] # Enable data persistence
    ports:
      - "6379:6379"
    volumes:
      - nextgen_redis_data:/data # Persist Redis data (results, redbeat schedule)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nextgen_local_nw

  rabbitmq:
    image: docker.io/rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672" # RabbitMQ broker port
      - "15672:15672" # RabbitMQ management UI port
    volumes:
      - nextgen_rabbitmq_data:/var/lib/rabbitmq # Persist RabbitMQ data outside the container
    healthcheck:
      # * check_port_connectivity (not ping): ping passes before the AMQP listener is up
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s # RabbitMQ takes a while to boot
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"  # Route rabbitmq.localhost to this service
      - "traefik.http.routers.rabbitmq.service=rabbitmq-service"
      - "traefik.http.services.rabbitmq-service.loadbalancer.server.port=15672"
    networks:
      - nextgen_local_nw

  celeryworker:
    <<: *api
    ports: []
    labels: [] # Do not inherit the api Traefik labels: no HTTP route for the worker
    command: /start-celeryworker.sh # Overrides CMD; runs Celery worker (see start-celeryworker.sh)

  flower:
    <<: *api
    ports:
      - "5555:5555" # Expose Flower monitoring UI on port 5555
    volumes: # Overriding replaces the whole list, so repeat the api mounts
      - .:/app
      - /app/.venv
      - nextgen_local_logs:/app/src/backend/app/logs
      - nextgen_flower_data:/flower_data # Persist Flower database (see start-flower.sh)
    command: /start-flower.sh # Overrides CMD; runs Flower monitoring (see start-flower.sh)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.entrypoints=web"
      - "traefik.http.routers.flower.rule=Host(`flower.localhost`)"  # Route flower.localhost to this service
      - "traefik.http.routers.flower.service=flower-service"
      - "traefik.http.services.flower-service.loadbalancer.server.port=5555"

  celerybeat:
    <<: *api
    ports: []
    labels: [] # Do not inherit the api Traefik labels: no HTTP route for beat
    command: /start-celerybeat.sh # Overrides CMD; runs Celery beat scheduler (see start-celerybeat.sh)

networks:
  nextgen_local_nw:
    external: true # Must be created manually: docker network create nextgen_local_nw

volumes:
  nextgen_local_db:      # PostgreSQL data
  nextgen_mailpit_data:  # Mailpit email storage
  nextgen_local_logs:    # App log files (fastapi-user owned, seeded from image layer)
  nextgen_redis_data:    # Redis data (Celery results, redbeat schedule)
  nextgen_rabbitmq_data: # RabbitMQ data
  nextgen_flower_data:   # Flower monitoring data
